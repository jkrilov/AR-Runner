name: AR-Runner
options:
  minimumXcodeGenVersion: 2.44.0
  bundleIdPrefix: com.arrunner
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: '16.0'
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: '18.0'
    watchOS: '11.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    # SWIFT_STRICT_CONCURRENCY=complete is implicit under Swift 6 language mode — D8 still in effect.
    CURRENT_PROJECT_VERSION: 33
    MARKETING_VERSION: 0.5.2
    # CODE_SIGN_STYLE is intentionally NOT pinned here. xcodegen would otherwise
    # bake Automatic into the project-level pbxproj, which has higher precedence
    # than xcconfig and prevents CI from switching to Manual signing for the
    # archive (rc4 trap — see .squad/skills/ios-testflight-ci-via-actions/SKILL.md).
    # Style is driven entirely by Config/Signing.xcconfig: bootstrap-signing.sh
    # writes Automatic for local dev; release-testflight.yml overrides to Manual
    # for the Release archive only.
    CODE_SIGN_STYLE: $(inherited)
# Project-wide signing config. Config/Signing.xcconfig is gitignored (Config/ is
# generated). Run `./scripts/bootstrap-signing.sh` once to create it, then edit
# to add your DEVELOPMENT_TEAM. CI writes it from the APPLE_TEAM_ID secret.
# See docs/dev/testflight-setup.md.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
fileGroups:
  - README.md
  - docs
  - project.yml

packages:
  ARRunnerCore:
    path: ARRunnerCore

targets:
  ARRunnerWatch:
    type: application
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - path: ARRunnerWatch
        optional: true
    dependencies:
      - target: ARRunnerWidgetsWatch
        embed: true
      - package: ARRunnerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arrunner.phone.watchkitapp
        PRODUCT_NAME: ARRunnerWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
      configs:
        # Release-only pin (rc9 — D-RICHARDS-TF-16). With manual signing +
        # `-allowProvisioningUpdates`, xcodebuild fetches the named profile
        # from App Store Connect at archive time. No local install step on
        # the runner. If you rename this profile in App Store Connect,
        # update this string too. Debug is left unset so local dev with
        # Automatic signing keeps working.
        Release:
          PROVISIONING_PROFILE_SPECIFIER: AR-Runner Watch
    info:
      path: Config/ARRunnerWatch-Info.plist
      properties:
        # Version keys must reference the build settings so CI's xcodebuild
        # CLI overrides (MARKETING_VERSION/CURRENT_PROJECT_VERSION) actually
        # reach the IPA's Info.plist. Without `$(VAR)` placeholders, xcodegen
        # writes its literal defaults (1.0/1) and the build-setting overrides
        # are silently dropped because GENERATE_INFOPLIST_FILE=NO when an
        # external Info.plist is used (rc1/rc2 trap — see
        # .squad/skills/ios-testflight-ci-via-actions/SKILL.md).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: AR-Runner
        CFBundleIconName: AppIcon
        NSHealthShareUsageDescription: AR-Runner reads workout metrics so your watch can drive the HUD and summary experience.
        NSHealthUpdateUsageDescription: AR-Runner saves completed workouts and summaries to Health.
        NSBluetoothAlwaysUsageDescription: AR-Runner connects your Apple Watch directly to ActiveLook glasses during workouts.
        # rc2 (2026-05-20) — Joe's 5K bench feedback item #1: workouts
        # arrived in Apple Health without a GPS route. CoreLocation can't
        # deliver fixes (and HKWorkoutRouteBuilder stays empty) without
        # this usage string in the watch Info.plist. Pairing this with
        # the substrate's `CLLocationManager` + `HKWorkoutRouteBuilder`
        # wiring restores the route polyline and, by extension, the
        # Strava auto-import path that depends on it.
        NSLocationWhenInUseUsageDescription: AR-Runner records your route during a workout so you can see the map in Apple Health and share runs to services like Strava.
        UIBackgroundModes:
          - bluetooth-central
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.arrunner.phone
        WKSupportsRunningWithoutiPhone: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/ARRunnerWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arrunner.shared
        com.apple.developer.healthkit: true

  ARRunnerPhone:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: ARRunnerPhone
        optional: true
        excludes:
          - "Tests/**"
    dependencies:
      - target: ARRunnerWidgetsPhone
        embed: true
      # rc14 — embed the Watch companion app into the iOS bundle so it
      # installs to the paired Apple Watch via the Watch app. Without this
      # dependency xcodegen never emits the "Embed Watch Content" build
      # phase and the IPA ships with no Payload/.../Watch/ARRunnerWatch.app,
      # which silently breaks watch pairing (rc13 symptom: iOS app present,
      # watch app missing from "Available Apps"). The Watch target's
      # WKCompanionAppBundleIdentifier must equal ARRunnerPhone's bundle ID
      # and its PRODUCT_BUNDLE_IDENTIFIER must be the phone bundle ID +
      # ".watchkitapp" (see .squad/skills/wkcompanion-bundle-id-prefix-rule).
      - target: ARRunnerWatch
        embed: true
      - package: ARRunnerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arrunner.phone
        PRODUCT_NAME: ARRunnerPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        # Prevent xcodegen from injecting CODE_SIGN_IDENTITY="iPhone Developer"
        # at target level, which would override the project-level xcconfig pin.
        # $(inherited) defers to the xcconfig where CI sets Apple Distribution.
        CODE_SIGN_IDENTITY: $(inherited)
      configs:
        # Release-only profile pin (rc9 — D-RICHARDS-TF-16). See
        # ARRunnerWatch for the full rationale.
        Release:
          PROVISIONING_PROFILE_SPECIFIER: AR-Runner
    info:
      path: Config/ARRunnerPhone-Info.plist
      properties:
        # See ARRunnerWatch.info.properties for the rc1/rc2 rationale on
        # why these MUST be $(VAR) placeholders, not literals.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: AR-Runner
        # rc11 — Apple validation requires CFBundleIconName when icons live in
        # an asset catalog (iOS 11+). Must match ASSETCATALOG_COMPILER_APPICON_NAME.
        CFBundleIconName: AppIcon
        NSHealthShareUsageDescription: AR-Runner reads workouts and live metrics to mirror your run on iPhone.
        NSHealthUpdateUsageDescription: AR-Runner stores run summaries and AR metadata alongside HealthKit workouts.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
        UILaunchScreen: {}
        # rc13 — when uploading as --type ios (universal iPhone+iPad build),
        # Apple's validator requires ALL FOUR orientations including
        # UIInterfaceOrientationPortraitUpsideDown to support iPad
        # multitasking. rc12 was rejected with ITMS-90474 for omitting it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # v0.5 PR 2 — Strava OAuth (D-Strava-1, D-Strava-3). The custom URL
        # scheme `arrunner` is the redirect target both ASWebAuthenticationSession
        # and the native Strava app's mobile-authorize hand-off listen on. Must
        # match StravaConfig.redirectURI and the redirect URI registered on the
        # Strava API console (Authorization Callback Domain = ar-runner.app).
        CFBundleURLTypes:
          - CFBundleURLName: com.arrunner.phone.strava
            CFBundleURLSchemes:
              - arrunner
        # Required on iOS 9+ for `UIApplication.canOpenURL(strava://)` to
        # return `true` when the user has the Strava app installed. Without
        # this entry the native-app OAuth path silently falls through to
        # ASWebAuthenticationSession.
        LSApplicationQueriesSchemes:
          - strava
        # Strava public client_id. Read by StravaConfig.clientID at runtime.
        # xcodebuild substitutes $(STRAVA_CLIENT_ID) from build settings or
        # the env. Safe to ship — the secret half lives on the Cloudflare
        # Worker (D-Strava-3). If unset, the Settings UI surfaces a config
        # warning instead of dead-ending in Safari.
        StravaClientID: $(STRAVA_CLIENT_ID)
    entitlements:
      path: Config/ARRunnerPhone.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arrunner.shared
        com.apple.developer.healthkit: true

  ARRunnerWidgetsPhone:
    type: app-extension
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: ARRunnerWidgets
        optional: true
    dependencies:
      - package: ARRunnerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arrunner.phone.widgets
        PRODUCT_NAME: ARRunnerWidgetsPhone
        SKIP_INSTALL: YES
      configs:
        # Release-only profile pin (rc9 — D-RICHARDS-TF-16).
        Release:
          PROVISIONING_PROFILE_SPECIFIER: AR-Runner Widgets
    info:
      path: Config/ARRunnerWidgetsPhone-Info.plist
      properties:
        # See ARRunnerWatch.info.properties for the rc1/rc2 rationale.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: AR-Runner Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/ARRunnerWidgetsPhone.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arrunner.shared

  ARRunnerWidgetsWatch:
    type: app-extension
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - path: ARRunnerWidgets
        optional: true
    dependencies:
      - package: ARRunnerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arrunner.phone.watchkitapp.widgets
        PRODUCT_NAME: ARRunnerWidgetsWatch
        SKIP_INSTALL: YES
      configs:
        # Release-only profile pin (rc9 — D-RICHARDS-TF-16).
        Release:
          PROVISIONING_PROFILE_SPECIFIER: AR-Runner Watch Widgets
    info:
      path: Config/ARRunnerWidgetsWatch-Info.plist
      properties:
        # See ARRunnerWatch.info.properties for the rc1/rc2 rationale.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: AR-Runner Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/ARRunnerWidgetsWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arrunner.shared

  ARRunnerPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: ARRunnerPhone/Tests
        optional: true
    dependencies:
      - target: ARRunnerPhone
      - package: ARRunnerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arrunner.phone.tests
        PRODUCT_NAME: ARRunnerPhoneTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ARRunnerPhone.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ARRunnerPhone
        BUNDLE_LOADER: $(TEST_HOST)
