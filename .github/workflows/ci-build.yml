name: CI — App Builds (macOS)

# Runs xcodegen + xcodebuild for each of the four schemes in project.yml,
# matching Amber's local validation commands (docs/dev/macos-build-validation.md).
# No code signing (CODE_SIGNING_ALLOWED=NO). Generic simulator destinations.
#
# macOS runners are billed at ~10x Linux. Concurrency cancellation + matrix
# parallelism keep wall-clock and cost in check.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  xcodebuild:
    name: ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: ARRunnerWatch
            destination: generic/platform=watchOS Simulator
          - scheme: ARRunnerPhone
            destination: generic/platform=iOS Simulator
          - scheme: ARRunnerWidgetsPhone
            destination: generic/platform=iOS Simulator
          - scheme: ARRunnerWidgetsWatch
            destination: generic/platform=watchOS Simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Xcode 16.4 — the macos-15 runner image ships it as the default Xcode
      # with the iOS 18.5 AND watchOS 11.5 simulator runtimes pre-installed
      # (both satisfy our D2 minimums of iOS 18 / watchOS 11). Older Xcode 16.0
      # nominally bundles iOS 18.0 / watchOS 11.0 runtimes per the runner image
      # manifest, but in practice the watchOS 11.0 simulator runtime is missing
      # on the live image and `xcodebuild -downloadPlatform watchOS` cannot run
      # unattended on CI (exit 70 — Apple ID auth required). Pinning a Xcode
      # whose runtimes are pre-baked sidesteps both problems.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache SwiftPM (Xcode-resolved)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-xcode-${{ matrix.scheme }}-${{ hashFiles('ARRunnerCore/Package.swift', 'project.yml') }}
          restore-keys: |
            spm-xcode-${{ matrix.scheme }}-
            spm-xcode-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ matrix.scheme }}-${{ hashFiles('project.yml', 'ARRunnerCore/Package.swift') }}
          restore-keys: |
            deriveddata-${{ matrix.scheme }}-

      # project.yml references Config/Signing.xcconfig (gitignored). Running the
      # bootstrap script with no env creates a placeholder xcconfig so xcodegen
      # doesn't fail with "Invalid config file". This job builds with
      # CODE_SIGNING_ALLOWED=NO so the empty DEVELOPMENT_TEAM is harmless.
      - name: Bootstrap signing xcconfig
        run: ./scripts/bootstrap-signing.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: xcodebuild ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -project AR-Runner.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
