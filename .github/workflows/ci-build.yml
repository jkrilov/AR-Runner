name: CI — App Builds (macOS)

# Runs xcodegen + xcodebuild for each of the four schemes in project.yml,
# matching Amber's local validation commands (docs/dev/macos-build-validation.md).
# No code signing (CODE_SIGNING_ALLOWED=NO). Generic simulator destinations.
#
# macOS runners are billed at ~10x Linux. Concurrency cancellation + matrix
# parallelism keep wall-clock and cost in check.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  xcodebuild:
    name: ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: ARRunnerWatch
            destination: generic/platform=watchOS Simulator
          - scheme: ARRunnerPhone
            destination: generic/platform=iOS Simulator
          - scheme: ARRunnerWidgetsPhone
            destination: generic/platform=iOS Simulator
          - scheme: ARRunnerWidgetsWatch
            destination: generic/platform=watchOS Simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache SwiftPM (Xcode-resolved)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-xcode-${{ matrix.scheme }}-${{ hashFiles('ARRunnerCore/Package.swift', 'project.yml') }}
          restore-keys: |
            spm-xcode-${{ matrix.scheme }}-
            spm-xcode-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ matrix.scheme }}-${{ hashFiles('project.yml', 'ARRunnerCore/Package.swift') }}
          restore-keys: |
            deriveddata-${{ matrix.scheme }}-

      - name: Generate Xcode project
        run: xcodegen generate

      # macos-15 + Xcode 16 ships with the watchOS 11 SDK but NOT the watchOS 11
      # simulator runtime. The widget-extension scheme tolerates the gap (it never
      # needs a destination resolved beyond the SDK), but the app scheme's
      # destination resolver rejects `generic/platform=watchOS Simulator` with
      # "watchOS 11.0 is not installed". Install on-demand for watchOS cells only.
      - name: Install watchOS simulator runtime
        if: contains(matrix.destination, 'watchOS')
        run: sudo xcodebuild -downloadPlatform watchOS

      - name: xcodebuild ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -project AR-Runner.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
