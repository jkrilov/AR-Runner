name: CI — App Builds (macOS)

# Runs xcodegen + xcodebuild for each of the four schemes in project.yml,
# matching Amber's local validation commands (docs/dev/macos-build-validation.md).
# No code signing (CODE_SIGNING_ALLOWED=NO). Generic simulator destinations.
#
# macOS runners are billed at ~10x Linux. Concurrency cancellation + matrix
# parallelism keep wall-clock and cost in check.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  xcodebuild:
    name: ${{ matrix.scheme }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Align with release-testflight.yml (PR #31): Xcode 26.4 ships the iOS 26.4
      # and watchOS 26.4 SDKs. Apple now requires App Store submissions to be
      # built with the iOS 26 SDK; we keep CI on the same toolchain so PRs
      # surface SDK-level breakage before tagging an rc. The macos-26 runner
      # defaults to Xcode 26.2; we pin 26.4 for the latest stable SDK
      # (26.5 is beta on the image).
      XCODE_VERSION: '26.4'
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: watchOS targets need careful destination handling on
          # macos-26-arm64. That runner image does NOT ship a watchOS
          # Simulator runtime preinstalled (macos-15 did). Two cases:
          #   - ARRunnerWatch (app scheme): builds fine against
          #     `generic/platform=watchOS` (device-class generic, same form
          #     release-testflight.yml uses for archive). No sim runtime
          #     needed.
          #   - ARRunnerWidgetsWatch (app-extension scheme): its scheme does
          #     NOT surface a device-class generic watchOS destination on
          #     this image — only macOS / iOS / iOS Simulator appear in
          #     `xcodebuild -showdestinations`. It requires the watchOS
          #     Simulator runtime to be installed (see the conditional
          #     "Install watchOS Simulator runtime" step below) and uses the
          #     `=watchOS Simulator` destination.
          # See skill: ios-testflight-ci-via-actions → "Runner image runtime
          # drift".
          - scheme: ARRunnerWatch
            destination: generic/platform=watchOS
          - scheme: ARRunnerPhone
            destination: generic/platform=iOS Simulator
          - scheme: ARRunnerWidgetsPhone
            destination: generic/platform=iOS Simulator
          - scheme: ARRunnerWidgetsWatch
            destination: generic/platform=watchOS Simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Xcode 26.4 — matches release-testflight.yml (rc12, PR #31). The
      # macos-26 runner image ships Xcode 26.2 as default with iOS 26.x and
      # visionOS 26.x simulator runtimes pre-installed (but NOT watchOS — see
      # destination note above). Pinning 26.4 keeps PR builds on the same SDK
      # that ships to TestFlight, so SDK-level breakage surfaces here rather
      # than at tag-time. Avoid 26.5 (beta on the image). See:
      # actions/runner-images macos-26-arm64-Readme.md
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache SwiftPM (Xcode-resolved)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-xcode-${{ matrix.scheme }}-${{ hashFiles('ARRunnerCore/Package.swift', 'project.yml') }}
          restore-keys: |
            spm-xcode-${{ matrix.scheme }}-
            spm-xcode-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ matrix.scheme }}-${{ hashFiles('project.yml', 'ARRunnerCore/Package.swift') }}
          restore-keys: |
            deriveddata-${{ matrix.scheme }}-

      # project.yml references Config/Signing.xcconfig (gitignored). Running the
      # bootstrap script with no env creates a placeholder xcconfig so xcodegen
      # doesn't fail with "Invalid config file". This job builds with
      # CODE_SIGNING_ALLOWED=NO so the empty DEVELOPMENT_TEAM is harmless.
      - name: Bootstrap signing xcconfig
        run: ./scripts/bootstrap-signing.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # Only the ARRunnerWidgetsWatch scheme requires this: its app-extension
      # scheme does not surface a `generic/platform=watchOS` device-class
      # destination on macos-26-arm64 (which has no preinstalled watchOS
      # Simulator runtime), so we install one. The watch *app* scheme
      # (ARRunnerWatch) builds fine without it via `generic/platform=watchOS`.
      # See skill: ios-testflight-ci-via-actions → "Runner image runtime drift".
      - name: Install watchOS Simulator runtime
        if: matrix.scheme == 'ARRunnerWidgetsWatch'
        run: xcodebuild -downloadPlatform watchOS

      - name: xcodebuild ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -project AR-Runner.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
