name: CodeQL — Swift

# GitHub CodeQL security analysis for Swift sources.
# Runs on PRs, pushes to main, and a weekly schedule (catches advisories
# published after the code lands).
#
# CodeQL Swift requires a macOS runner and a real build — we re-run
# xcodegen + xcodebuild for ARRunnerWatch as the build driver (the
# largest single target that pulls in ARRunnerCore + ARRunnerWidgetsWatch).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Sunday 07:00 UTC — pick up newly-published Swift queries weekly
    - cron: '0 7 * * 0'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL (swift)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Mirrors ci-build.yml + release-testflight.yml (PR #31). Keeping the
      # CodeQL build driver on the same Xcode/SDK as the release pipeline
      # ensures the queries see the same Swift toolchain semantics that ship
      # to TestFlight.
      XCODE_VERSION: '26.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Xcode 26.4 — mirrors ci-build.yml + release-testflight.yml (rc12,
      # PR #31). The macos-26 runner ships Xcode 26.2 as default with the
      # iOS/watchOS 26.x simulator runtimes pre-installed; we pin 26.4 for the
      # latest stable SDK. Avoid 26.5 (beta on the image).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install xcodegen
        run: brew install xcodegen

      # project.yml references Config/Signing.xcconfig (gitignored). Running the
      # bootstrap script with no env creates a placeholder xcconfig so xcodegen
      # doesn't fail with "Invalid config file". This job builds with
      # CODE_SIGNING_ALLOWED=NO so the empty DEVELOPMENT_TEAM is harmless.
      - name: Bootstrap signing xcconfig
        run: ./scripts/bootstrap-signing.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          # Use security-extended to surface a broader set of queries than
          # the default suite. Performance cost is acceptable on the weekly
          # cadence + per-PR.
          queries: security-extended

      - name: Build for CodeQL (ARRunnerWatch)
        run: |
          set -o pipefail
          xcodebuild \
            -project AR-Runner.xcodeproj \
            -scheme ARRunnerWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
