name: Release — TestFlight

# Triggered on pre-release tags matching v*.*.*-* (e.g. v0.2.0-rc1, v0.2.0-beta3).
# A pure-release tag like v0.2.0 (no pre-release suffix) is intentionally NOT
# handled here — that path will live in a separate `release-appstore.yml`
# workflow when we're ready to submit for review. Until then, ship to TestFlight
# from rc/beta tags.
#
# Versioning:
#   MARKETING_VERSION       = tag with leading 'v' stripped (e.g. 0.2.0-rc1)
#   CURRENT_PROJECT_VERSION = github.run_number (monotonically increasing,
#                              unique per Actions run, satisfies App Store
#                              Connect's "build number must increase" rule).
#
# Approach: native xcodebuild + App Store Connect API key + manual signing
# with `-allowProvisioningUpdates` and PROVISIONING_PROFILE_SPECIFIER per
# target (set in project.yml). Xcode fetches the named profiles from App
# Store Connect at archive time — no fastlane, no `match`, no extra
# private repo for profiles, no local profile install step. Trade-off:
# profile names are hardcoded in project.yml; renaming a profile in the
# portal requires updating project.yml.

on:
  push:
    tags:
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 0.2.0-rc1). Optional — defaults to the contents of the VERSION file at the repo root. Bump VERSION in a commit before triggering.'
        required: false
        type: string

concurrency:
  # Serialize releases — App Store Connect won't accept overlapping uploads
  # for the same build number, and dispatching two tags in flight is a
  # foot-gun we'd rather queue than race.
  group: release-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Archive & upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Xcode 26.4 ships iOS 26.4 + watchOS 26.4 SDKs, satisfying Apple's
      # requirement that new App Store submissions be built with the iOS 26 SDK
      # (enforced since WWDC 2025). The macos-26 runner defaults to Xcode 26.2;
      # we pin 26.4 for the latest stable SDK. Avoid 26.5 (beta on the image).
      # See: actions/runner-images macos-26-arm64-Readme.md
      XCODE_VERSION: '26.4'
      ARCHIVE_PATH: build/ARRunnerPhone.xcarchive
      EXPORT_PATH: build/export
      EXPORT_OPTIONS_PLIST: build/ExportOptions.plist
      PROJECT_FILE: AR-Runner.xcodeproj
      SCHEME: ARRunnerPhone
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags so the version-monotonicity guard
          # can compare the resolved release version against every
          # existing release tag, not just the tip commit.
          fetch-depth: 0

      - name: Resolve version from tag, dispatch input, or VERSION file
        id: version
        run: |
          set -euo pipefail
          # Resolution order:
          #   1. Tag push  → strip leading 'v' from the tag (authoritative).
          #   2. workflow_dispatch with explicit input → use the input.
          #   3. workflow_dispatch with no input → read VERSION file at repo root.
          # The VERSION file is the single source of truth for the *next*
          # release; bump it in a commit before dispatching this workflow.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_VERSION="${{ inputs.version }}"
            VERSION_SOURCE="dispatch input"
            if [[ -z "$RAW_VERSION" ]]; then
              if [[ ! -f VERSION ]]; then
                echo "::error::No version input provided and VERSION file is missing at repo root."
                exit 1
              fi
              RAW_VERSION="$(tr -d '[:space:]' < VERSION)"
              VERSION_SOURCE="VERSION file"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            RAW_VERSION="${TAG#v}"
            VERSION_SOURCE="git tag $TAG"
          fi
          if [[ -z "$RAW_VERSION" ]]; then
            echo "::error::Could not resolve version (ref=$GITHUB_REF, event=${{ github.event_name }}, source=$VERSION_SOURCE)"
            exit 1
          fi
          echo "Version source: $VERSION_SOURCE"
          # CFBundleShortVersionString must be numeric (N, N.N, or N.N.N) —
          # App Store Connect hard-rejects prerelease suffixes like "-rc2".
          # Strip everything from the first '-' onward so v0.3.0-rc3 → 0.3.0.
          # The full tag/raw value is still used for artifact filenames and
          # release notes; only the embedded CFBundleShortVersionString is
          # normalized here. (rc1/rc2 version-bump trap — see
          # .squad/files/version-bump-diagnosis.md.)
          MARKETING_VERSION="${RAW_VERSION%%-*}"
          echo "raw_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved RAW=$RAW_VERSION  MARKETING_VERSION=$MARKETING_VERSION  CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER"

      - name: Guard against backward version steps
        env:
          RAW_VERSION: ${{ steps.version.outputs.raw_version }}
        run: |
          set -euo pipefail
          # Reject any release whose version is not strictly greater than the
          # highest existing v* tag. This is the safety net that prevents the
          # 0.5.0-rc2-after-0.5.1 class of mistake. We use `sort -V` (version
          # sort) which orders 0.5.0-rc2 < 0.5.0 < 0.5.1 < 0.5.2 as expected
          # for our tag scheme. Pure-release tags (vX.Y.Z) and pre-release
          # tags (vX.Y.Z-rcN) are both considered.
          git fetch --tags --force --quiet || true
          LATEST_TAG="$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -n 1 || true)"
          if [[ -z "$LATEST_TAG" ]]; then
            echo "No existing v* tags found — skipping monotonicity check."
            exit 0
          fi
          echo "Latest released version: $LATEST_TAG"
          echo "Proposed release version: $RAW_VERSION"
          if [[ "$RAW_VERSION" == "$LATEST_TAG" ]]; then
            echo "::error::Version $RAW_VERSION matches an existing tag (v$LATEST_TAG). Bump the VERSION file before releasing."
            exit 1
          fi
          HIGHEST="$(printf '%s\n%s\n' "$LATEST_TAG" "$RAW_VERSION" | sort -V | tail -n 1)"
          if [[ "$HIGHEST" != "$RAW_VERSION" ]]; then
            echo "::error::Refusing to release $RAW_VERSION: it is lower than the latest existing tag v$LATEST_TAG. Bump the VERSION file (and update project.yml MARKETING_VERSION) before retriggering."
            exit 1
          fi
          echo "OK — $RAW_VERSION is strictly greater than v$LATEST_TAG."

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache SwiftPM (Xcode-resolved)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-release-${{ hashFiles('ARRunnerCore/Package.swift', 'project.yml') }}
          restore-keys: |
            spm-release-

      # --- Signing setup -----------------------------------------------------
      #
      # We create a per-job temporary keychain, import the distribution cert
      # (.p12 from secret), and install the App Store Connect API key into
      # ~/.appstoreconnect/private_keys/ so xcodebuild can find it for both
      # `-allowProvisioningUpdates` (during archive/export) and altool
      # (during upload). The keychain is deleted in the post step.

      - name: Create temporary keychain & import distribution certificate
        env:
          BUILD_CERTIFICATE_P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_P12_BASE64 }}
          BUILD_CERTIFICATE_P12_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${BUILD_CERTIFICATE_P12_BASE64}" || -z "${BUILD_CERTIFICATE_P12_PASSWORD}" || -z "${KEYCHAIN_PASSWORD}" ]]; then
            echo "::error::Missing one of BUILD_CERTIFICATE_P12_BASE64 / BUILD_CERTIFICATE_P12_PASSWORD / KEYCHAIN_PASSWORD secrets."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/arrunner-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"

          echo "$BUILD_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$BUILD_CERTIFICATE_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign + xcodebuild to use the key without a UI prompt.
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          # Prepend our keychain to the search list (login.keychain stays available).
          # shellcheck disable=SC2046 # Want word-splitting on the existing list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Installed signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_STORE_CONNECT_API_KEY_ID}" || -z "${APP_STORE_CONNECT_API_ISSUER_ID}" || -z "${APP_STORE_CONNECT_API_KEY_P8}" ]]; then
            echo "::error::Missing one of APP_STORE_CONNECT_API_KEY_ID / APP_STORE_CONNECT_API_ISSUER_ID / APP_STORE_CONNECT_API_KEY_P8 secrets."
            exit 1
          fi

          # xcodebuild + altool look here automatically when given -authenticationKeyID / -apiKey.
          API_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEYS_DIR"
          API_KEY_PATH="$API_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "Installed ASC API key $APP_STORE_CONNECT_API_KEY_ID for issuer $APP_STORE_CONNECT_API_ISSUER_ID"

      # --- Provisioning profiles (rc9 pivot — Richards, D-RICHARDS-TF-16) ---
      #
      # No download step. We use xcodebuild's native profile fetch instead.
      #
      # rc8 history: we tried `fastlane sigh download_all` to populate the
      # runner's `~/Library/MobileDevice/Provisioning Profiles/` directory.
      # The step exited code 0 but the directory was empty — sigh's
      # `--platform ios` filter silently excluded our profiles (whose
      # Platform array is `[iOS, xrOS, visionOS]`, not `[iOS]`). Vacuous
      # success is the worst kind of failure: the next step (archive) hit
      # the byte-identical "requires a provisioning profile with the <X>
      # feature" error and the run log made it look like the profiles had
      # been installed.
      #
      # rc9 fix: drop sigh entirely. With manual signing + a valid App
      # Manager ASC API key + `-allowProvisioningUpdates`, xcodebuild can
      # fetch a profile BY NAME from App Store Connect at archive time
      # via `PROVISIONING_PROFILE_SPECIFIER`. No local installation,
      # no fastlane dependency, no platform-filter trap.
      #
      # The specifier values live in `project.yml` per target so they
      # apply to every build (local archive and CI alike). Profile names
      # the workflow depends on (DO NOT rename in App Store Connect
      # without updating project.yml):
      #
      #   ARRunnerPhone         → "AR-Runner"
      #   ARRunnerWidgetsPhone  → "AR-Runner Widgets"
      #   ARRunnerWatch         → "AR-Runner Watch"
      #   ARRunnerWidgetsWatch  → "AR-Runner Watch Widgets"

      # --- Project generation -----------------------------------------------

      - name: Write Config/Signing.xcconfig from APPLE_TEAM_ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_TEAM_ID}" ]]; then
            echo "::error::APPLE_TEAM_ID secret is not set."
            exit 1
          fi
          APPLE_TEAM_ID="$APPLE_TEAM_ID" ./scripts/bootstrap-signing.sh

          # Switch to Manual signing + pin Apple Distribution identity for the
          # Release archive. Rationale (rc4 trap, run 26003539754):
          #
          # `xcodebuild ... archive` with CODE_SIGN_STYLE=Automatic defaults to
          # the Apple Development identity on CLI (the GUI archive action
          # promotes to Distribution, the CLI does not). Pinning
          # CODE_SIGN_IDENTITY=Apple Distribution in xcconfig is then treated
          # as a conflicting "manually specified" override and Xcode errors out
          # with "automatically signed for development, but a conflicting code
          # signing identity Apple Distribution has been manually specified" on
          # every signed target (main app AND widget extension — rc4 proved
          # the per-target gotcha).
          #
          # The only escape is CODE_SIGN_STYLE=Manual for the archive: it tells
          # Xcode "use exactly the identity I specified, no inference". Manual
          # + `-allowProvisioningUpdates` + the App Store Connect API key lets
          # Xcode fetch/create the App Store distribution profile on demand.
          #
          # Why here (xcconfig) and not on the xcodebuild CLI?
          #   - rc3 proved CLI signing settings have highest precedence and
          #     create cross-layer conflicts with xcconfig values.
          #   - xcodebuild's CLI parser does NOT support `SETTING[sdk=...]=value`
          #     conditional syntax — it silently mis-parses (rc2 trap).
          #   - xcconfig is the only safe place to set signing config.
          #
          # Local dev is unaffected: bootstrap-signing.sh writes
          # `CODE_SIGN_STYLE = Automatic` only; these Manual + Distribution
          # lines are appended only in CI. Joe's Personal Team + Apple
          # Development device debugging continues to work.
          cat >> Config/Signing.xcconfig <<'EOF'

          // Release CI archive: Manual signing with explicit Distribution
          // identity. Required because CLI archive + Automatic style picks
          // Apple Development by default and treats any Distribution pin as
          // a "conflicting manually specified" identity (rc4 trap).
          // See release-testflight.yml + SKILL.md for the full rationale.
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=watchos*] = Apple Distribution
          EOF

          cat Config/Signing.xcconfig

      - name: Write Config/Strava.xcconfig from vars
        env:
          STRAVA_CLIENT_ID: ${{ vars.STRAVA_CLIENT_ID }}
        run: |
          mkdir -p Config
          cat > Config/Strava.xcconfig <<EOF
          // Strava.xcconfig — generated by CI from vars.STRAVA_CLIENT_ID
          STRAVA_CLIENT_ID = ${STRAVA_CLIENT_ID:-}
          EOF
          echo "Strava xcconfig written (client ID length: ${#STRAVA_CLIENT_ID})"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare ExportOptions.plist
        # Export-time signing resolution is INDEPENDENT from build/archive-time
        # signing. xcodebuild's `-exportArchive` ignores the archive's
        # PROVISIONING_PROFILE_SPECIFIER and reads its profile map exclusively
        # from this plist. The template at scripts/ExportOptions.plist pins
        # signingStyle=manual and lists all four bundle-id → profile-name
        # mappings; profile names must stay in sync with project.yml's
        # PROVISIONING_PROFILE_SPECIFIER values and with App Store Connect.
        # rc10 trap (D-RICHARDS-TF-17): when this map is missing, exportArchive
        # falls back to "cloud signing" and fails with the misleading
        # "Cloud signing permission error" + "No profiles for '<bundle id>'
        # were found" pair, despite the archive having been signed correctly.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          sed "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/g" scripts/ExportOptions.plist > "$EXPORT_OPTIONS_PLIST"
          plutil -lint "$EXPORT_OPTIONS_PLIST"
          cat "$EXPORT_OPTIONS_PLIST"

      # --- Archive & export -------------------------------------------------

      - name: Archive (xcodebuild)
        # Signing strategy (rc4 fix — Richards, 2026-05-17T17:44Z):
        #
        # All signing config lives in Config/Signing.xcconfig (written above):
        #   CODE_SIGN_STYLE = Manual
        #   CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
        #   CODE_SIGN_IDENTITY[sdk=watchos*] = Apple Distribution
        #
        # The Archive CLI passes NO signing-related build settings except
        # DEVELOPMENT_TEAM (a secret value, not a mode selector — safe to
        # pass on CLI). `-allowProvisioningUpdates` + the ASC API key let
        # Xcode fetch or create the App Store distribution profile for each
        # bundle ID on demand.
        #
        # Why Manual (not Automatic)?
        #   rc1: identity inheritance trap (Apple Development default →
        #        "no devices").
        #   rc2: CLI [sdk=...] conditional syntax mis-parsed by xcodebuild.
        #   rc3: CLI CODE_SIGN_STYLE shadowed xcconfig identity.
        #   rc4: CLI archive + CODE_SIGN_STYLE=Automatic ALWAYS resolves
        #        to Apple Development identity (unlike GUI archive which
        #        promotes to Distribution); xcconfig's Distribution pin
        #        is then treated as a manual conflict on EVERY signed
        #        target (main app + widget extension).
        #
        # Manual signing makes the identity choice explicit and matches
        # the archive's actual intent. It also requires removing
        # `CODE_SIGN_STYLE: Automatic` from project.yml's base settings
        # (xcodegen would otherwise inject it into project-level pbxproj
        # at higher precedence than xcconfig) — that change ships in this
        # same PR.
        #
        # Apple Developer portal prerequisite: an App Store distribution
        # profile (or wildcard) must be creatable for both bundle IDs:
        #   com.arrunner.phone
        #   com.arrunner.phone.widgets
        # `-allowProvisioningUpdates` + ASC API key creates them on first
        # run if absent.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build_number }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            -authenticationKeyPath "$API_KEY_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive

      - name: Export .ipa (xcodebuild -exportArchive)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            -authenticationKeyPath "$API_KEY_PATH"

          echo "Exported artifacts:"
          ls -la "$EXPORT_PATH"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::No .ipa produced by exportArchive."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IPA at $IPA_PATH"

      # --- Upload to TestFlight ---------------------------------------------

      - name: Upload to App Store Connect (TestFlight)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          # `xcrun altool --upload-app` is the documented, supported uploader.
          # Apple has deprecated `altool` for *signing* operations but the
          # `--upload-app` path remains the recommended flow for App Store
          # Connect uploads as of Xcode 16. If/when Apple removes it we'll
          # swap in `xcrun notarytool`-equivalent (currently for notarization)
          # or migrate to the App Store Connect REST API.
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      # --- Artifacts for forensic debugging ---------------------------------

      - name: Upload .ipa as workflow artifact
        if: always() && env.IPA_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: ARRunnerPhone-${{ steps.version.outputs.raw_version }}-${{ steps.version.outputs.build_number }}.ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 14

      - name: Upload xcarchive on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ARRunnerPhone-${{ steps.version.outputs.raw_version }}.xcarchive
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 7

      # --- Cleanup -----------------------------------------------------------

      - name: Delete temporary keychain & API key
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -n "${API_KEY_PATH:-}" && -f "$API_KEY_PATH" ]]; then
            rm -f "$API_KEY_PATH"
          fi
